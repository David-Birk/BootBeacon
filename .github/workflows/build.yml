name: Build BootBeacon

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BootBeacon
          path: build/BootBeacon.kext
